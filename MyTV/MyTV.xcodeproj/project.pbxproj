/* Begin PBXShellScriptBuildPhase section */
		000000000000000150000000 /* Fix Shallow Framework Bundles */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			name = "Fix Shallow Framework Bundles";
			shellPath = /bin/sh;
			shellScript = (
				"if [ \"$PLATFORM_NAME\" = \"macosx\" ]; then",
				"    FRAMEWORKS_DIR=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"",
				"    if [ -d \"$FRAMEWORKS_DIR\" ]; then",
				"        for framework in \"$FRAMEWORKS_DIR\"/*.framework; do",
				"            if [ -d \"$framework\" ] && [ -f \"$framework/Info.plist\" ] && [ ! -d \"$framework/Versions\" ]; then",
				"                name=$(basename \"$framework\" .framework)",
				"                mkdir -p \"$framework/Versions/A/Resources\"",
				"                mv \"$framework/Info.plist\" \"$framework/Versions/A/Resources/\"",
				"                if [ -f \"$framework/$name\" ]; then",
				"                    mv \"$framework/$name\" \"$framework/Versions/A/\"",
				"                fi",
				"                (cd \"$framework/Versions\" && ln -sfn A Current)",
				"                (cd \"$framework\" && ln -sfn Versions/Current/$name \"$name\")",
				"                (cd \"$framework\" && ln -sfn Versions/Current/Resources Resources)",
				"                codesign --force --sign - --preserve-metadata=identifier,entitlements,flags \"$framework\" || true",
				"            fi",
				"        done",
				"    fi",
				"fi",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

